<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Restaurante - Guia de Lisboa</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='editar_restaurante.css') }}">
</head>
<body>
    <h1>Editar Restaurante</h1>
    <hr>
    <form method="POST">
        <p>Nome: <input type="text" name="nome" value="{{ restaurante.nome }}" required></p>
        <p>Zona: <input type="text" name="zona" value="{{ restaurante.zona }}" required></p>
        <p>Especialidade: <input type="text" name="especialidade" value="{{ restaurante.especialidade }}" required></p>
        <p>Gama de Preço:
            <select name="preco" required>
                <option value="Barato" {% if restaurante.preco == 'Barato' %}selected{% endif %}>Barato</option>
                <option value="Médio" {% if restaurante.preco == 'Médio' %}selected{% endif %}>Médio</option>
                <option value="Caro" {% if restaurante.preco == 'Caro' %}selected{% endif %}>Caro</option>
            </select>
        </p>
        <button type="submit">Guardar Alterações</button>
        <a href="{{ url_for('restaurantes') }}">Cancelar</a>
    </form>
</body>
</html>
